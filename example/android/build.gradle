allprojects {
    repositories {
        mavenLocal() // app.miniwall:sdk until it is on Maven Central: ./gradlew publishToMavenLocal in miniwall-android
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

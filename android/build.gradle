group 'com.miniwall.flutter'
version '0.1.0'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
    }
}

// app.miniwall:sdk is served from the Miniwall Maven repository; declaring it here means an app that adds this plugin needs no extra setup.
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://maven.miniwall.app'
            content { includeGroup 'app.miniwall' }
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.miniwall.flutter'
    compileSdk 35
    defaultConfig { minSdk 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // The native SDK, from https://maven.miniwall.app. To work on it locally, include miniwall-android in the app's
    // android/settings.gradle (see README) and this resolves to the local project.
    implementation 'app.miniwall:sdk:0.1.0'
}

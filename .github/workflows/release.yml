name: Release

# Publishes miniwall_flutter to pub.dev with automated publishing (OIDC, no token) when a version tag is pushed.
# pub.dev only allows this for a package that already exists, so the FIRST version is published by hand
# (`flutter pub publish` on the owner's machine), then the owner enables "Automated publishing" for this repository on pub.dev
# with the tag pattern `{{version}}`. Needs the iOS pod and the Android artifact of the same version first (guard checks both).
# Nothing is published until the owner creates the `publish` environment with required reviewers and sets PUBLISH_ENABLED=true.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  guard:
    name: tag checks
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.g.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: g
        env:
          TAG: ${{ github.ref_name }}
          ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $TAG is not on main"; exit 1; }
          v=$(sed -n 's/^version: *//p' pubspec.yaml)
          [ "$v" = "$TAG" ] || { echo "::error::tag $TAG does not match pubspec.yaml ($v)"; exit 1; }
          a=$(sed -n "s/^version '\(.*\)'/\1/p" android/build.gradle)
          [ "$a" = "$TAG" ] || { echo "::error::tag $TAG does not match android/build.gradle ($a)"; exit 1; }
          grep -qE "^## ${TAG//./\\.}( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }
          android=$(sed -n "s/.*'app.miniwall:sdk:\([^']*\)'.*/\1/p" android/build.gradle)
          [ "$android" = "$TAG" ] || { echo "::error::android/build.gradle depends on app.miniwall:sdk:$android, expected $TAG (the SDKs release together)"; exit 1; }
          curl -fsSI "https://repo1.maven.org/maven2/app/miniwall/sdk/$TAG/sdk-$TAG.pom" >/dev/null || { echo "::error::app.miniwall:sdk:$TAG is not on Maven Central yet"; exit 1; }
          for pod in MiniwallCore MiniwallSDK; do
            curl -fsS -o /dev/null "https://trunk.cocoapods.org/api/v1/pods/$pod/specs/$TAG" || { echo "::error::$pod $TAG is not on CocoaPods yet"; exit 1; }
          done
          echo "enabled=${ENABLED:-false}" >> "$GITHUB_OUTPUT"

  test:
    name: analyze and test
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get && flutter analyze && flutter test

  publish:
    name: publish to pub.dev
    needs: test
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write # pub.dev automated publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      # setup-dart sets up the OIDC credentials pub.dev accepts; Flutter itself is needed to resolve the `flutter` SDK dependency.
      # Test this once with a -rc tag before relying on it for 0.1.0 (the first version of the package is published by hand anyway).
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub publish --force

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A release created by hand from the tag already exists: that is fine, only create it when it does not.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists"; else gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes; fi

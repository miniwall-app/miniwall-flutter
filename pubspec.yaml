name: miniwall_flutter
description: Miniwall for Flutter. Show paywalls, onboarding and offers built in the Miniwall dashboard, rendered natively by the iOS and Android SDKs.
version: 0.1.0
homepage: https://docs.miniwall.app
repository: https://github.com/miniwall-app/miniwall-flutter
issue_tracker: https://github.com/miniwall-app/miniwall-flutter/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.miniwall.flutter
        pluginClass: MiniwallFlutterPlugin
      ios:
        pluginClass: MiniwallFlutterPlugin
